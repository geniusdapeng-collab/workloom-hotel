#phone{position:relative;width:390px;height:844px;border:1px solid #ecd7de;border-radius:44px;overflow:hidden;

#wxcaps .ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink2)}

.shead .chip{margin-left:auto;flex:none;margin-top:2px}

.sect::before{content:"";width:3px;height:12px;border-radius:2px;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 8px rgba(255,36,66,.3)}
.sect .n{margin-left:auto;font-weight:400;font-size:10px;color:var(--ink2);font-family:ui-monospace,monospace;flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;height:20px;border-radius:999px;border:1px solid var(--line);padding:0 8px;font-size:10px;color:var(--ink2);white-space:nowrap;flex:none}
.chip.g{border-color:var(--gline);color:var(--gold)}
.chip.ok{border-color:rgba(34,200,138,.5);color:var(--go-t)}
.chip.warn{border-color:rgba(255,77,109,.5);color:var(--warn)}
.chip.amber{border-color:rgba(255,170,51,.55);color:var(--amber-t)}
.chip.holo{border-color:rgba(77,150,255,.4);color:var(--holo)}
.num{font-family:ui-monospace,monospace;color:var(--goldhi);font-weight:700}
.mono{font-family:ui-monospace,monospace;font-size:10px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:8px}
.clamp1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;font-size:12px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:30px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 12px;font-size:11px;color:var(--ink2);white-space:nowrap}
.btn.g{border:0;color:var(--ongold);background:linear-gradient(135deg,var(--gold),var(--gold2))}
.btn.ok{border-color:rgba(34,200,138,.55);color:var(--go-t)}
.btn.warn{border-color:rgba(255,77,109,.5);color:var(--warn)}
.btn.big{height:40px;border-radius:999px;font-size:12px;width:100%}
.btn.done{opacity:.5;pointer-events:none}
input.inp{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:8px 14px;font-size:12px;outline:none;font-family:inherit;height:34px}
input.inp:focus{border-color:var(--gline)}
input.inp::placeholder{color:var(--ink3)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:10px 4px;text-align:center}
.stat .v{font-size:19px;font-weight:800;color:var(--goldhi);font-family:ui-monospace,monospace;line-height:1.2}
.stat .k{font-size:10px;color:var(--ink2);margin-top:3px}
.note{border-left:2px solid var(--gline);padding:6px 10px;font-size:10px;color:var(--ink2);background:rgba(255,36,66,.04);border-radius:0 8px 8px 0;line-height:1.7}
.diff-del{text-decoration:line-through;color:var(--warn);opacity:.8}
.diff-add{color:var(--go-t)}
/* 底部 Tab */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:25;display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.96);padding-bottom:6px}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:var(--ink2);position:relative}
#tabbar button .ic{width:22px;height:22px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2)}
#tabbar button.on{color:var(--gold)}
#tabbar button.on .ic{border-color:var(--gline);color:var(--gold);box-shadow:0 0 8px rgba(255,36,66,.25)}
#tabbar button .bdg{position:absolute;top:6px;margin-left:22px;min-width:14px;height:14px;border-radius:7px;background:var(--warn);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}

#askbar{position:absolute;left:0;right:0;bottom:58px;z-index:26;display:none;border-top:1px solid var(--line);background:rgba(255,255,255,.97);padding:8px 12px 10px}
#askbar .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;white-space:nowrap}
#askbar .chips::-webkit-scrollbar{display:none}

 color:var(--goldhi);border-radius:10px;padding:8px 14px;font-size:11px;line-height:1.6;box-shadow:0 8px 30px rgba(51,38,43,.18);opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.show{opacity:1}
/* 底部弹层（工单详情） */
#sheet{position:absolute;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .mask{position:absolute;inset:0;background:rgba(51,38,43,.35)}
#sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;border-top:1px solid var(--gline);border-radius:16px 16px 0 0;background:var(--bg);padding:14px 14px 20px}
#sheet .grab{width:36px;height:4px;border-radius:2px;background:#e9cfd8;margin:0 auto 10px}
/* 经营主页 */
.holo-wrap{position:relative;width:100%;height:190px;overflow:hidden;border:1px solid #ebdde0;border-radius:16px;
 background:radial-gradient(70% 85% at 50% 46%,#fff0f4 0%,rgba(255,240,244,.7) 60%,#fff8fa 100%)}
.holobody{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:130px;height:130px}
.holobody .or{position:absolute;border-radius:50%;border:1px solid;transform:rotateX(68deg)}
@keyframes hspin{to{transform:rotateX(68deg) rotate(360deg)}}
.sat{position:absolute;width:10px;height:10px;border-radius:50%;border:0;z-index:6;transform:translate(-50%,-50%)}
.sat small{position:absolute;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:var(--ink2)}
.bubble{border:1px solid var(--gline);border-radius:14px;background:var(--panel);padding:10px 12px;font-size:12px;line-height:1.7}
.subt{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 0;margin-bottom:10px}
.subt .in{display:flex;gap:28px;white-space:nowrap;font-size:10px;color:var(--ink2);animation:tk 30s linear infinite;width:max-content}
@keyframes tk{to{transform:translateX(-50%)}}
.subt b{color:var(--ink);font-weight:600}
/* 时间线 */
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:rgba(255,36,66,.18)}
.tl .nd{position:relative;padding-bottom:12px}
.tl .nd:last-child{padding-bottom:0}

.tl .nd.fut::before{background:#e9cfd8;box-shadow:none}

.tl .nd .d{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.6}

.tint-grape{background:#f7f2ff;border:1px solid #e3deea;border-radius:16px}
/* 矮视口适配：视口偏矮时手机壳等比缩小顶对齐，保证底 Tab 完整可见 */

/* 审批三手势（镜像 P3/P4：采纳=权重1 / 编辑后采纳=权重2 / 驳回=权重3） */
function decide(id,g,btn){
 const card=btn.closest("[data-apr]");const q=D.approvals.find(x=>x.id===id);
 if(g==="reject"){q.status="rejected"}else if(g==="edit"){q.status="edited"}else{q.status="approved"}
 const st=card.querySelector(".apr-st");
 if(st){st.className="apr-st chip "+(q.status==="approved"?"ok":q.status==="edited"?"holo":"warn");st.textContent=dictText(APPROVAL_STATUS_TEXT,q.status)}
 card.querySelectorAll(".btn").forEach(b=>b.classList.add("done"));
 const gt=g==="approve"?"采纳（权重 1）":g==="edit"?"编辑后采纳（权重 2）":"驳回（权重 3，原因已必填）";
 toast(`已${gt} · 全链留痕（审批 ${id}）`)}
function aprCard(q,showTier){
 return `<div class="card tint-amber" data-apr="${q.id}" style="${q.status==="pending"?"border-color:rgba(255,170,51,.4)":""}">

   <span class="apr-st chip ${q.status==="approved"?"ok":q.status==="rejected"?"warn":q.status==="edited"?"holo":"amber"}">${dictText(APPROVAL_STATUS_TEXT,q.status)}</span></div>
  <div class="mono" style="margin-top:5px">${q.action} · 审批 ${q.id} · ${q.rule}${showTier?" · "+tierText(q.tier):""}</div>
  <div style="font-size:11px;color:var(--ink2);margin-top:6px;line-height:1.7" class="clamp2">${q.rationale}</div>

  <div class="row" style="margin-top:9px;gap:6px">
   <button class="btn ok" style="flex:1" onclick="decide('${q.id}','approve',this)">✓ 采纳</button>

 <div style="font-size:11px;line-height:1.7;color:var(--ink2)">问句走 <b style="color:var(--holo)">ask</b> 即时应答；明确任务走 <b style="color:var(--gold)">quest</b> 自动立项（→ 任务中心）；含糊指令我会反问澄清，不直接建任务。再说得具体一点？</div>`}
VIEWS.ask=()=>`<div class="scr" style="padding-bottom:16px">
 ${shead("Ask · 有事随时说","全局常驻","<span class=\"chip g\">待批 2</span>")}
 <div id="askFlow">
  ${askU("有新增差评吗")}${askA(askAiReview())}
  ${askU("汇总本周差评给我")}${askA(askAiQuest())}
  ${askU("试试知识库检索")}${askA(askAiKb())}
 </div>
 <div class="note">本屏即对话主屏：首页落地直达，全局常驻。输入分流——问句走 ask（意图路由即时应答，回答带引用与回执）；明确任务走 quest（自动立项 → 任务中心）；含糊指令反问澄清。</div>
</div>`;
function askSend(preset){
 const inp=$("#askIn");const t=(preset||(inp?inp.value:"")||"").trim();if(!t)return;
 if(inp&&!preset)inp.value="";
 const flow=$("#askFlow");if(!flow)return;
 flow.insertAdjacentHTML("beforeend",askU(esc(t)));
 const th="th"+Date.now();
 flow.insertAdjacentHTML("beforeend",`<div id="${th}" style="font-size:10px;color:var(--ink2);margin-bottom:10px">AI 助手正在思考…</div>`);
 $("#view").scrollTop=$("#view").scrollHeight;
 setTimeout(()=>{
  $("#"+th).remove();
  let a;
  if(/差评/.test(t))a=askAiReview();
  else if(/超时|工单/.test(t))a=askAiSla();
  else if(/检索|知识库|早餐/.test(t))a=askAiKb();
  else if(/汇总|报告|周报|本周|整理/.test(t))a=askAiQuest();
  else a=askAiFallback();
  flow.insertAdjacentHTML("beforeend",askA(a));
  $("#view").scrollTop=$("#view").scrollHeight;
 },520);
}

/* ================= 路由与外壳 ================= */
function route(){
 const h=(location.hash||"#ask").slice(1);
 const v=VIEWS[h]?h:"ask";
 $("#view").innerHTML=VIEWS[v]();
 const tab=TAB_OF[v]||"ask";
 $("#tabbar").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="location.hash='${t[0]}'"><span class="ic">${t[2]}</span>${t[1]}${t[0]==="p4"?'<span class="bdg">2</span>':""}</button>`).join("");
 const isAsk=v==="ask";
 $("#askbar").style.display=isAsk?"block":"none";
 $("#view").style.bottom=isAsk?"146px":"58px";
 if(v==="svc")renderSvcTk();
 if(v==="kb")kbSearch();
 if(v==="tickets")renderTkList();
 if(isAsk)$("#view").scrollTop=$("#view").scrollHeight;else $("#view").scrollTop=0;
}
window.addEventListener("hashchange",route);
route();
</script>
