<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkLoom Hotel · 云栖酒店 — 全系统高保真 DEMO（PC）</title>
<style>
:root{
  --bg950:#fff5f7; --bg:#fff0f4; --card:#ffffff; --panel:#fff0f4;
  --line:rgb(255 36 66 / .14); --gline:rgb(255 36 66 / .32); --gold:#ff2442; --gold2:#ff7a9e; --goldhi:#d4002a;
  --holo:#4d96ff; --holo2:#6ec6ff; --ink:#33262b; --ink2:#8a757d; --ink3:#b9a9b0;
  --go:#22c88a; --warn:#ff4d6d; --amber:#ffaa33; --amberdk:#c87a1a; --need:#b678ff;
  --railw:320px; /* AskRail 展开 320px / 收起 56px（镜像生产 StarRing.tsx askrail-width 布局协作） */
}
body{padding-right:var(--railw)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg950);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#ffd0dc;border-radius:3px}
.starbg{position:fixed;inset:0;pointer-events:none;z-index:0;
 background:
 radial-gradient(60% 45% at 18% 8%, rgba(255,122,158,.10), transparent 70%),
 radial-gradient(50% 40% at 85% 20%, rgba(182,120,255,.08), transparent 70%),
 radial-gradient(70% 50% at 50% 110%, rgba(255,36,66,.06), transparent 70%);}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;
 background-image:
 radial-gradient(1px 1px at 12% 22%, rgba(255,122,158,.35) 50%, transparent 51%),
 radial-gradient(1px 1px at 34% 68%, rgba(255,122,158,.25) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 57% 15%, rgba(77,150,255,.30) 50%, transparent 51%),
 radial-gradient(1px 1px at 72% 47%, rgba(255,122,158,.30) 50%, transparent 51%),
 radial-gradient(1px 1px at 88% 78%, rgba(255,122,158,.22) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 25% 88%, rgba(255,170,51,.25) 50%, transparent 51%),
 radial-gradient(1px 1px at 45% 40%, rgba(255,122,158,.25) 50%, transparent 51%),
 radial-gradient(1px 1px at 66% 90%, rgba(255,122,158,.28) 50%, transparent 51%),
 radial-gradient(1px 1px at 94% 10%, rgba(255,122,158,.22) 50%, transparent 51%),
 radial-gradient(1.5px 1.5px at 8% 55%, rgba(77,150,255,.20) 50%, transparent 51%);}
/* DEMO NAV */
#demonav{position:sticky;top:0;z-index:60;background:rgba(255,245,247,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#demonav .dn-t{font-size:10px;letter-spacing:.2em;color:var(--gold);margin-right:6px;font-weight:700}
#demonav a{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--ink2);line-height:1.25;background:var(--card)}
#demonav a small{font-size:9px;color:var(--ink3);font-family:ui-monospace,monospace}
#demonav a.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,36,66,.12)}
/* Bridge 外壳 */
#bridge{position:relative;z-index:1;width:min(1440px,97%);margin:18px auto 90px;border:1px solid var(--line);border-radius:20px;overflow:hidden;
 background:linear-gradient(to bottom,#ffffff,#fff5f7);box-shadow:0 30px 80px rgba(214,0,42,.10)}
.tick{position:absolute;width:18px;height:18px;border:2px solid var(--gold);z-index:5;pointer-events:none}
.tick.tl{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:20px}
.tick.tr{top:-1px;right:-1px;border-left:0;border-bottom:0;border-top-right-radius:20px}
.tick.bl{bottom:-1px;left:-1px;border-right:0;border-top:0;border-bottom-left-radius:20px}
.tick.br{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:20px}
.abar{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);padding:10px 18px;backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;letter-spacing:.08em}
.logo .d{width:16px;height:16px;transform:rotate(45deg);border-radius:3px;background:linear-gradient(135deg,#ff7a9e,#ff2442);box-shadow:0 0 14px rgba(255,36,66,.25)}
.logo .t{background:linear-gradient(90deg,#d4002a,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.abar .ws{font-size:12px;color:var(--ink3)}.abar .ws b{color:var(--ink2);font-weight:600}
.abar .sp{flex:1}
.hbtn{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--ink2);background:transparent}
.hbtn:hover{border-color:var(--gline)}
.hbtn.g{border-color:var(--gline);color:var(--gold)}
.pill{display:flex;align-items:center;gap:6px;border:1px solid rgba(34,200,138,.4);border-radius:999px;padding:3px 12px;font-size:11px;color:var(--go);background:rgba(34,200,138,.06)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 8px var(--go);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.4}}
.brk{border:1px solid rgba(255,77,109,.55);border-radius:999px;padding:3px 12px;font-size:11px;color:var(--warn);background:rgba(255,77,109,.06)}
.brk:hover{background:rgba(255,77,109,.15)}
.brk.armed{background:var(--warn);color:#fff}
.simbar{border-bottom:1px solid var(--line);background:#fff3d6;padding:5px 18px;font-size:11px;color:#92400e;display:flex;gap:8px;align-items:center}
.simbar b{color:var(--amberdk)}
.route-tag{font-family:ui-monospace,monospace;font-size:10px;color:var(--holo);border:1px solid rgba(77,150,255,.3);border-radius:4px;padding:1px 6px;margin-left:auto}
/* 布局 */
.main{display:flex;min-height:640px}
.col-l{width:236px;border-right:1px solid var(--line);padding:12px;flex:none}
.col-r{width:264px;border-left:1px solid var(--line);padding:12px;flex:none}
.col-c{flex:1;padding:20px;min-width:0}
.glabel{font-size:11px;letter-spacing:.2em;color:var(--ink3);margin:0 0 8px 4px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px}
.card.hov:hover{border-color:var(--gline)}
.panel{margin-bottom:16px}
.ptitle{font-size:12px;letter-spacing:.18em;color:var(--ink3);margin-bottom:12px}
h1.pt{font-size:20px;font-weight:700;color:var(--ink)}
.pd{font-size:12px;color:var(--ink3);margin-top:4px}
.mono{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink2)}
.holo-tag{font-family:ui-monospace,monospace;font-size:11px;color:var(--holo)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 8px;font-size:11px;color:var(--ink2);white-space:nowrap}
.tag.g{border-color:var(--gline);color:var(--gold)}
.tag.ok{border-color:rgba(34,200,138,.5);color:var(--go)}
.tag.warn{border-color:rgba(255,77,109,.5);color:var(--warn)}
.tag.amber{border-color:rgba(255,170,51,.55);color:var(--amberdk)}
.tag.holo{border-color:rgba(77,150,255,.4);color:var(--holo)}
.btn{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12px;color:var(--ink2);background:transparent;white-space:nowrap}
.btn:hover{border-color:var(--gline);color:var(--gold)}
.btn.g{border-color:var(--gline);color:var(--gold);background:#fff}
.btn.ok{background:var(--go);border-color:var(--go);color:#fff}
.btn.ok:hover{color:#fff;border-color:var(--go)}
.btn.warn{border-color:rgba(255,77,109,.5);color:var(--warn)}
.btn.done{opacity:.55;pointer-events:none}
.btn.sm{padding:3px 10px;font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--goldhi)}
.stat .k{font-size:11px;color:var(--ink3);margin-top:2px}
.hbar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:11px;color:var(--ink2)}
.hbar .lb{width:86px;flex:none;color:var(--ink3);text-align:right}
.hbar .bar{flex:1;height:8px;border-radius:4px;background:#ffe4ec;overflow:hidden}
.hbar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff7a9e,var(--gold))}
.hbar .fill.c{background:linear-gradient(90deg,#6ec6ff,var(--holo))}
.hbar .vl{width:56px;flex:none;color:var(--ink2)}
table.dt{width:100%;border-collapse:collapse;font-size:12px}
table.dt th{font-size:11px;color:var(--ink2);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.dt td{padding:7px 8px;border-bottom:1px solid rgba(255,36,66,.10);color:var(--ink2)}
table.dt tr:hover td{background:rgba(77,150,255,.03)}
.flow{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;position:relative;padding:0 0 18px 4px}
.step::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:1px;background:var(--line)}
.step:last-child::before{display:none}
.step .ic{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--gline);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold);z-index:1}
.step .bd{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 12px}
.kbd-chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:11px;color:var(--ink3);background:transparent}
.kbd-chip:hover{border-color:var(--gline);color:var(--gold)}
input.inp,textarea.inp{flex:1;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 16px;font-size:13px;outline:none;font-family:inherit}
input.inp:focus{border-color:var(--gline)}
input.inp::placeholder,textarea.inp::placeholder{color:var(--ink3)}
/* toast */
#toast{position:fixed;left:calc(50% - var(--railw)/2);bottom:96px;transform:translateX(-50%);z-index:99;background:#ffffff;border:1px solid var(--gline);color:var(--goldhi);border-radius:8px;padding:8px 18px;font-size:12px;box-shadow:0 8px 30px rgba(214,0,42,.16);opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
/* LiveTicker */
#ticker{position:fixed;left:0;right:var(--railw);bottom:0;z-index:55;border-top:1px solid rgba(255,36,66,.16);background:rgba(255,255,255,.94);backdrop-filter:blur(8px);overflow:hidden;padding:6px 0}
#ticker .tk-in{display:flex;gap:36px;white-space:nowrap;font-size:11px;color:var(--ink3);animation:tk 42s linear infinite;width:max-content}
@keyframes tk{to{transform:translateX(-50%)}}
#ticker b{color:var(--ink2);font-weight:600}
#ticker .lv{color:var(--holo);letter-spacing:.2em;margin-right:10px}
/* AskRail 右侧固定通栏对话框（镜像生产 StarRing.tsx：320px 展开 / 56px 图标条收起 · 全页面常驻） */
#askrail{position:fixed;top:0;right:0;bottom:0;width:var(--railw);z-index:65;display:flex;flex-direction:column;
 border-left:1px solid var(--gline);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
 box-shadow:-20px 0 60px rgba(214,0,42,.10)}
#askrail .ar-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid #ebdde0;padding:10px 12px;background:#fff0f4}
#askrail .ar-logo{position:relative;width:32px;height:32px;flex:none;border-radius:50%;
 background:linear-gradient(135deg,#ff7a9e,#ff2442 45%,#ff2442);box-shadow:0 0 16px rgba(255,36,66,.22);
 display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
#askrail .ar-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;
 border:1px solid rgba(255,77,109,.45);background:#ff4d6d;color:#fff;font-size:10px;font-weight:700;
 display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 10px rgba(255,77,109,.45);
 font-family:ui-monospace,monospace}
#askrail .ar-title{font-size:11.5px;font-weight:900;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
#askrail .ar-route{font-family:ui-monospace,monospace;font-size:10px;color:var(--ink3);margin-top:1px}
#askrail .ar-hbtn{border:1px solid var(--gline);border-radius:999px;padding:2px 8px;font-size:10px;color:var(--gold);background:transparent;white-space:nowrap}
#askrail .ar-hbtn.dim{border-color:var(--line);color:var(--ink3)}
#askrail .ar-hbtn:hover{border-color:var(--gold);color:var(--goldhi)}
#askrail .ar-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
#askrail .ar-chips{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid rgba(255,36,66,.12);padding:8px 12px 0}
#askrail .ar-chips .kbd-chip{border-color:rgba(77,150,255,.35);color:var(--holo);padding:3px 10px;font-size:10px}
#askrail .ar-chips .kbd-chip:hover{border-color:var(--gline);color:var(--gold)}
#askrail .ar-input{padding:10px 12px 12px;display:flex;gap:8px}
#askrail .ar-input input{flex:1;min-width:0;border:1px solid var(--gline);border-radius:999px;background:#ffffff;color:var(--ink);
 padding:8px 12px;font-size:12px;outline:none;font-family:inherit}
#askrail .ar-input input::placeholder{color:var(--ink3)}
#askrail .ar-send{flex:none;border:0;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:900;color:#ffffff;
 background:linear-gradient(135deg,#ff7a9e,#ff2442 45%,#ff2442);cursor:pointer}
#askrail .ar-send:disabled{opacity:.4;cursor:not-allowed}
/* 消息流：HumanBubble 右蓝泡 / AgentActionMessage 左卡（镜像 hud/messages） */
.ar-hb{display:flex;justify-content:flex-end}
.ar-hb>div{max-width:84%;border:1px solid rgba(77,150,255,.4);border-radius:12px;border-top-right-radius:4px;
 background:rgba(77,150,255,.08);padding:8px 12px;font-size:12px;line-height:1.7;color:var(--ink)}
.ar-am{display:flex;justify-content:flex-start}
.ar-am>div{max-width:94%;border:1px solid var(--line);border-radius:12px;border-top-left-radius:4px;background:var(--card);padding:9px 12px}
.ar-am .ar-meta{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.ar-am .ar-meta b{font-size:12px}
.ar-am .ar-action{font-size:12px;font-weight:600;color:var(--holo)}
.ar-am .ar-text{margin-top:4px;font-size:12px;line-height:1.7;color:var(--ink2)}
.ar-quest{margin-top:8px;border:1px solid var(--gline);border-radius:8px;background:rgba(255,36,66,.05);padding:8px 12px}
.ar-cite{margin-top:8px;border:1px solid rgba(77,150,255,.3);border-radius:8px;background:rgba(77,150,255,.04);padding:8px 12px}
@keyframes arthk{0%,60%,100%{opacity:.25}30%{opacity:1}}
.ar-thinking span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:4px;animation:arthk 1s infinite}
.ar-thinking span:nth-child(2){animation-delay:.15s}.ar-thinking span:nth-child(3){animation-delay:.3s}
/* 收起态 56px 图标条 */
#askrail.rail-min{align-items:center;padding:12px 0;gap:12px}
#askrail.rail-min .ar-vtext{writing-mode:vertical-rl;font-size:10px;letter-spacing:.25em;color:var(--gold);font-weight:700}
#askrail.rail-min .ar-x{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11px;color:var(--ink3);background:transparent}
#askrail.rail-min .ar-x:hover{border-color:var(--gline);color:var(--gold)}
/* 经营主页 */
.theater{position:relative;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;margin:6px 14px 0;border:1px solid #ebdde0;border-radius:18px;
 background:radial-gradient(55% 50% at 50% 30%,#fff0f4 0%,rgba(255,240,244,.65) 55%,rgba(255,240,244,.25) 100%),linear-gradient(180deg,#fff7f9,#fff0f4)}
.holo-wrap{position:relative;width:420px;height:280px}
.holobody{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:200px;height:200px}
.holobody .or{position:absolute;border-radius:50%;border:1px solid;transform:rotateX(68deg)}
@keyframes hspin{to{transform:rotateX(68deg) rotate(360deg)}}
.sat{position:absolute;width:11px;height:11px;border-radius:50%;border:0;z-index:6;transform:translate(-50%,-50%)}
.sat small{position:absolute;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:var(--ink3);opacity:0;transition:.2s}
.sat:hover small{opacity:1}
.bubble{max-width:640px;width:100%;border:1px solid var(--gline);border-radius:12px;background:rgba(255,255,255,.94);padding:12px 16px;font-size:13px;line-height:1.7;backdrop-filter:blur(6px)}
.askcard{border:1px solid #e8d4ba;border-radius:14px;background:#fff6ec;padding:12px;box-shadow:0 0 40px rgba(255,170,51,.06)}
.subt{overflow:hidden;border-top:1px solid rgba(255,36,66,.12);background:rgba(255,240,244,.85);padding:6px 0}
.subt .in{display:flex;gap:32px;white-space:nowrap;font-size:11px;color:var(--ink3);animation:tk 36s linear infinite;width:max-content}
#ceremony{position:absolute;inset:0;z-index:40;background:#fff5f7;display:flex;align-items:center;justify-content:center;transition:opacity .7s}
#ceremony .c-dot{width:12px;height:12px;border-radius:50%;background:var(--gold);margin:0 auto 16px;transition:all .7s}
/* modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(51,38,43,.32);display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal .box{width:340px;border:1px solid var(--gline);border-radius:12px;background:var(--card);padding:16px}
/* floor */
#floorcv{width:100%;height:430px;display:block;border-radius:10px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* gauge */
.gauge{position:relative;width:110px;height:110px;margin:0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .gv b{font-size:20px;color:var(--goldhi)}
.gauge .gv span{font-size:10px;color:var(--ink3)}
.diff-del{text-decoration:line-through;color:var(--warn);opacity:.75}
.diff-add{color:#0e7a4a;background:rgba(34,200,138,.10);border-radius:3px;padding:0 3px}
.note{border-left:2px solid var(--gline);padding:6px 12px;font-size:11px;color:var(--ink3);background:rgba(255,36,66,.04);border-radius:0 6px 6px 0}
/* 模块色块分区（淡色晕染 · 仅背景不做功能色 · 16px 圆角 + 同色深 8% 极浅描边） */
.tint-peach{background:#fff0f4;border:1px solid #ebdde0;border-radius:16px}
.tint-blue{background:#f0f7ff;border:1px solid #dce3ea;border-radius:16px}
.tint-mint{background:#f0fbf6;border:1px solid #dce7e2;border-radius:16px}
.tint-amber{background:#fff6ec;border:1px solid #ebe2d8;border-radius:16px}
.tint-grape{background:#f7f2ff;border:1px solid #e3deea;border-radius:16px}
@media(max-width:1100px){.col-l,.col-r{display:none}}
</style>
</head>
<body>
<div class="starbg"></div><div class="stars"></div>

<nav id="demonav"></nav>

<div id="bridge">
  <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
  <header class="abar">
    <div class="logo"><span class="d"></span><span class="t">WorkLoom</span></div>
    <span class="ws">酒店智能经营系统 · <b>云栖酒店</b></span>
    <span class="sp"></span>
    <a class="hbtn" href="#p22">🛎 服务前台</a>
    <a class="hbtn g" href="#p21">董事长视图</a>
    <button class="pill" id="nightpill" data-toast="夜班班组运行中 · 昨夜 9 项已完成 · 跳转夜班中心频道（/p9）" onclick="location.hash='p9'"><span class="dot"></span>夜班 · 运行中 · 9 完成</button>
    <button class="brk" id="brake">⛔ 紧急制动</button>
