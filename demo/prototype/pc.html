<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>WorkLoom 酒店智能经营系统 · PC 工作台（云栖酒店样板间）</title>
<style>
:root{--navy:#1B2A4E;--navy2:#24365f;--gold:#C9A45C;--bg:#F4F6FA;--card:#fff;--ink:#1c2333;--sub:#6b7690;--green:#2e9e6b;--amber:#d9930d;--red:#d64545;--line:#e6eaf2;--blue:#3f6fe0}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--ink)}
#app{display:flex;min-height:100vh}
aside{width:224px;background:var(--navy);color:#cdd6ea;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .logo{padding:20px 18px 14px;color:#fff;font-size:17px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.08)}
aside .logo small{display:block;font-size:11px;color:var(--gold);font-weight:400;margin-top:3px}
aside .sec{padding:14px 18px 6px;font-size:11px;color:#7f8db3;letter-spacing:1px}
aside a{display:flex;align-items:center;gap:9px;padding:9px 18px;font-size:13.5px;color:#cdd6ea;cursor:pointer;border-left:3px solid transparent;text-decoration:none}
aside a:hover{background:var(--navy2);color:#fff}
aside a.on{background:var(--navy2);color:#fff;border-left-color:var(--gold)}
aside a .b{margin-left:auto;background:var(--red);color:#fff;font-size:10px;border-radius:8px;padding:1px 7px}
main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:16px}
.mode{font-size:11px;background:#eef2fb;color:var(--blue);border-radius:10px;padding:3px 10px}
.store{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.page{padding:22px 24px 60px;display:none}
.page.on{display:block}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h3{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:8px}
.kpi{font-size:26px;font-weight:700}
.kpi small{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.delta{font-size:12px;margin-top:4px}.up{color:var(--green)}.down{color:var(--red)}.warn{color:var(--amber)}
.tag{display:inline-block;font-size:11px;border-radius:8px;padding:2px 8px;margin-right:6px}
.t-green{background:#e5f5ec;color:var(--green)}.t-amber{background:#fbf1da;color:var(--amber)}.t-red{background:#fbe5e5;color:var(--red)}.t-blue{background:#e8effc;color:var(--blue)}.t-gray{background:#eef1f6;color:var(--sub)}.t-gold{background:#f7efdd;color:var(--gold)}
.list .row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.list .row:last-child{border-bottom:none}
.list .row:hover{background:#fafbfe}
.row .t{color:var(--sub);font-size:12px;flex-shrink:0;width:52px}
.row .main{flex:1;min-width:0}.row .main b{display:block;font-size:13px}.row .main span{font-size:12px;color:var(--sub)}
.btn{border:none;border-radius:9px;padding:7px 16px;font-size:13px;cursor:pointer;background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.gold{background:var(--gold)}
.btn.sm{padding:4px 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
.bar{height:8px;border-radius:4px;background:#edf0f6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.ringwrap{display:flex;gap:18px;align-items:center}
.ring{width:86px;height:86px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;position:relative}
.ring b{font-size:18px}.ring span{font-size:11px;color:var(--sub);font-weight:400}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.col-h{font-size:12px;font-weight:600;padding:8px 12px;border-radius:9px;margin-bottom:8px}
.ch-g{background:#e5f5ec;color:var(--green)}.ch-a{background:#fbf1da;color:var(--amber)}.ch-r{background:#fbe5e5;color:var(--red)}
.mini{background:#fafbfe;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:8px;cursor:pointer}
.mini:hover{border-color:var(--gold)}
.mini b{display:block;font-size:12.5px;margin-bottom:2px}
.mini span{color:var(--sub);font-size:11.5px}
.modal-mask{position:fixed;inset:0;background:rgba(20,28,48,.45);display:none;align-items:center;justify-content:center;z-index:99}
.modal-mask.on{display:flex}
.modal{background:#fff;border-radius:16px;width:640px;max-width:92vw;max-height:84vh;overflow-y:auto;padding:24px 26px}
.modal h2{font-size:17px;margin-bottom:4px}
.modal .sub{font-size:12.5px;color:var(--sub);margin-bottom:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 14px;font-size:13px;margin:12px 0}
.kv b{color:var(--sub);font-weight:500}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
.flow .st{background:#eef2fb;color:var(--navy);font-size:12px;border-radius:8px;padding:5px 10px}
.flow .st.done{background:#e5f5ec;color:var(--green)}
.flow .st.cur{background:var(--gold);color:#fff}
.flow .ar{color:#b8c0d4}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 22px;font-size:13px;display:none;z-index:120}
.toast.on{display:block;animation:up .25s}
@keyframes up{from{transform:translate(-50%,10px);opacity:0}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:7px 0}
.hbar .lb{width:120px;color:var(--sub);flex-shrink:0}
.hbar .bar{flex:1}
.hbar .vl{width:70px;text-align:right}
.note{font-size:12px;color:var(--sub);background:#fafbfe;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}
.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-size:13px}
.gesture{display:flex;gap:10px;margin-top:14px}
.gesture .btn{flex:1;padding:10px}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.cols3{grid-template-columns:1fr}}
</style>
</head>
