# 四客群默认安装清单（v2.1 新增；§2.2 槽⑤班组装配的客群化默认配置；v3.3 新增 audit_only 质检客群）
# 用途：新工作区按客群一键初始化——预装技能（ordered：首屏展示顺序=销售叙事顺序）、启用 preset、默认触发器、围栏 patch。
# 纪律：清单只决定「默认装什么、什么前置」，运行时仍全量过围栏瀑布（L8.3）；客户后续可自助加装技能市场任意技能。
# 客户旅程：audit_only（只读体检 1-2 周）→ 影子模式（3 天）→ 正式托管（low_star_single / homestay / unmanned）。
version: hotel-segment-defaults/v2
segments:

  # ========== 质检模式（Audit-Only · 只读体检期）· 零风险先行 ==========
  audit_only:
    label: 质检模式（只读体检期）
    pitch: 先体检，再托管——PMS/OTA 只读扫描，系统不动一根手指，15-30 分钟出《酒店快速体检报告》，1-2 周出完整体检
    fence_patch: fences/patches/audit-only-patch.yml
    # 只读/分析岗：inspection-agent/competitor-agent/owner-cockpit 为 readonly: true 纯只读岗；
    # reconcile-agent/review-agent 本体含写工具，但 audit-only patch default_level=block 物理熔断一切写动作，
    # 体检期仅其只读工具子集生效（只读对账/只读评价分析），写回通道由围栏强制关闭。
    presets: [inspection-agent, competitor-agent, owner-cockpit, reconcile-agent, review-agent]
    skills_ordered:  # 首屏顺序 = 五线巡检叙事：快扫当场见效→持续巡检→倒挂超售→对账→口碑
      - fast-scan  # 旗舰：快照快扫，15-30 分钟当场出《酒店快速体检报告》（售前验货与接入基线）
      - inspection-suite  # 持续：五线巡检套件（价格/房态库存/渠道/口碑/安全合规）
      - overbooking-parity-guard  # 价格健康+房态库存健康：多 OTA 倒挂/超售漏售只读监测
      - channel-reconciler  # 渠道健康：OTA 账单×PMS 订单只读勾稽，佣金错算/对账差异
      - review-crisis  # 口碑健康：存量未回差评盘点与处置草稿（只出草稿不发布）
      - review-asset-mining  # 口碑健康：好评资产盘点（可引用卖点挖掘）
      - pricing-matrix  # 价格健康：价格矩阵只读测算（保底价/促销失误分析）
      - finance-reporting  # 只读报表：经营数据归集支撑体检估算
      - safety-compliance  # 安全与合规：担保异常/断点高频项/安全记录核查（R10 禁区不触碰）
      - morning-briefing  # 每日体检晨报（只读版决策包：发现/建议/风险三栏）
      - incident-postmortem  # 断点根因复盘（历史断点高频项归因）
    triggers_enabled: [tg-inspection-0700, tg-review-sla-30min, tg-parity-15min]

  # ========== 低星单体酒店（20–50 间）· 卖 ROI ==========
  low_star_single:
    label: 低星单体酒店
    pitch: 一年省 17 万，一个月回本
    fence_patch: fences/patches/low-star-single-patch.yml
    presets: [pricing-agent, review-agent, reconcile-agent, inspection-agent, frontdesk-agent, content-agent, competitor-agent, desktop-agent, phone-agent]
    skills_ordered:  # 首屏顺序 = 卖点排序：夜班→收益→对账→差评→其余
      - night-audit-suite        # 旗舰：夜班替代（夜班「三难」，年化 2.8–4.2 万即覆盖订阅）
      - revenue-manager          # 最大流失源（调价不及时占流失 40%）
      - pricing-matrix
      - channel-reconciler       # 对账/超售漏售
      - overbooking-parity-guard
      - review-crisis
      - review-asset-mining
      - ota-operations
      - checkin-checkout
      - customer-service
      - morning-briefing
      - handover-manager
      - inspection-suite
      - room-service-dispatch
      - staff-scheduler
      - inventory-procurement
      - finance-reporting
      - retention-manager
      - guest-profile-crm
      - maintenance-dispatch
      - safety-compliance
      - phone-concierge
      - content-marketing
      - ai-live-assistant
      - incident-postmortem
    triggers_enabled: [tg-inspection-0700, tg-night-2200, tg-review-sla-30min, tg-parity-15min]

  # ========== 民宿（5–20 间）· 卖自由 ==========
  homestay:
    label: 民宿
    pitch: 把夜晚还给业主
    fence_patch: fences/patches/homestay-patch.yml
    presets: [phone-agent, content-agent, frontdesk-agent, review-agent, pricing-agent, reconcile-agent, competitor-agent, owner-cockpit]
    skills_ordered:  # 首屏顺序 = 卖点排序：语音前台→夜班→内容营销（民宿命脉，前置）→其余
      - phone-concierge          # 旗舰：24h 语音前台，业主夜间可关机
      - night-audit-suite        # 深夜到店/留言全接管
      - content-marketing        # 小红书/抖音种草是民宿命脉，权重远高于单体酒店，前置
      - ai-live-assistant
      - review-crisis
      - review-asset-mining
      - guest-profile-crm        # 民宿复购靠熟客
      - retention-manager
      - customer-service
      - checkin-checkout
      - revenue-manager
      - pricing-matrix
      - channel-reconciler
      - ota-operations
      - overbooking-parity-guard
      - morning-briefing
      - handover-manager
      - inventory-procurement
      - finance-reporting
      - inspection-suite
      - room-service-dispatch
      - staff-scheduler
      - maintenance-dispatch
      - safety-compliance
      - incident-postmortem
    triggers_enabled: [tg-night-2200, tg-faq-mine-sun, tg-review-sla-30min]

  # ========== 无人酒店 · 卖断点收敛与管理半径 ==========
  unmanned:
    label: 无人酒店
    pitch: 断点不是事故，是资产——你的第 5 家店比第 1 家店更好管
    fence_patch: fences/patches/unmanned-patch.yml
    presets: [desktop-agent, phone-agent, owner-cockpit, inspection-agent, competitor-agent, pricing-agent, reconcile-agent, review-agent]
    skills_ordered:  # 首屏顺序 = 卖点排序：断点闭环→远程驾驶舱→夜间自治→安全底线→其余
      - incident-postmortem      # 旗舰：断点根因闭环，断点率单调收敛=模式可复制
      - night-audit-suite        # 夜间全自治（本无人，AI 是唯一选项）
      - safety-compliance        # R10 安全禁区：AI 只告警+联动报警，绝不自行处置（底线叙事）
      - phone-concierge          # 无人酒店唯一人工入口的 AI 前置层
      - overbooking-parity-guard
      - checkin-checkout         # 自助入住辅助+远程兜底
      - maintenance-dispatch     # 断点 5：维修派单
      - inspection-suite
      - room-service-dispatch
      - customer-service
      - review-crisis
      - revenue-manager
      - pricing-matrix
      - channel-reconciler
      - ota-operations
      - finance-reporting
      - morning-briefing
      - handover-manager
      - inventory-procurement
      - guest-profile-crm
      - retention-manager
      - staff-scheduler
      - content-marketing
      - ai-live-assistant
      - review-asset-mining
    triggers_enabled: [tg-night-2200, tg-incident-weekly, tg-parity-15min, tg-review-sla-30min, tg-faq-mine-sun]
